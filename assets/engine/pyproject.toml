[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "comsol-mcp"
version = "0.2.0"
description = "MCP server that lets an AI agent read, modify, mesh, solve and post-process COMSOL Multiphysics models — with the COMSOL desktop visible in real time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "comsol-mcp contributors" }]
keywords = ["comsol", "mcp", "model-context-protocol", "simulation", "mph", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.2",
    "MPh>=1.4",
    "tomlkit>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
comsol-mcp = "comsol_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/comsol_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]